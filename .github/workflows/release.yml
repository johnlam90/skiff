#
# Release pipeline for Skiff. Triggers on every push to main:
#
#   0. Runs the FULL test suite by calling .github/workflows/test.yml as a
#      reusable workflow. Everything below is gated on it: a red suite
#      never tags and never publishes. Calling the workflow (rather than
#      copying its steps, or trusting a separate run that happens to be
#      green) keeps one definition of "green" for PRs and releases.
#   1. Determines the next version. If internal/version/version.go names
#      a version that has no tag yet (you bumped major/minor manually),
#      the workflow uses that version as-is. Otherwise it auto-bumps the
#      patch number, commits the change back to main with [skip ci], and
#      pushes. A re-run resumes the bump it already pushed; a run that
#      main has moved past stands down for the newer one.
#   2. Tags v<x.y.z> and pushes the tag.
#   3. Runs goreleaser to cross-compile binaries (linux/darwin/windows ×
#      amd64/arm64), package them, attach them to a GitHub Release, and
#      push an updated Homebrew formula into Formula/ in this same repo
#      (using the default GITHUB_TOKEN — no separate tap repo or PAT
#      required).
#
# Both auto-commits (version bump, brew formula) carry [skip ci] so this
# workflow does not re-trigger itself. That marker is the only thing
# breaking the loop — do not remove it. Note that gating on test.yml adds
# no new trigger: workflow_call runs inside THIS run, so there is still
# exactly one workflow listening for pushes to main.

name: Release

on:
  push:
    branches: [main]
  # Manual escape hatch. If a merge commit accidentally carries a
  # skip-CI marker (or anything else suppresses the auto-trigger),
  # we can rerun the release flow against the current main without
  # needing an empty no-op commit. Bumps and tags exactly the same as
  # a normal push trigger.
  workflow_dispatch:

# Pushes back to main need write access to the repo's contents: the
# version-bump commit and the GoReleaser-written Formula/skiff.rb commit
# both push straight to main with the default token. id-token: write is
# cosign's keyless-signing OIDC exchange and attestations: write is the
# build-provenance attestation step — neither writes to the repo itself.
permissions:
  contents: write
  id-token: write
  attestations: write

# Serialise releases — no two version-bumps racing each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Gate. `needs: test` on the release job below is what makes a red
  # suite block the tag and the publish.
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history and tags: the version step asks which versions
          # are already tagged and what main holds past this commit, and
          # goreleaser reads prior tags for changelog generation.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Same toolchain source of truth as test.yml — the binaries we ship
      # must be built with the Go version the module declares, not
      # whatever "stable" resolved to on release day.
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # Decide what this run releases. Three questions, in order:
      #
      #   1. Is this a re-run of a run that already pushed its bump? Then
      #      main already holds "Release vX [skip ci]" directly on top of
      #      this commit (only other [skip ci] commits in between). Check
      #      that commit out and finish releasing vX — bumping again would
      #      build a second commit with the same parent, and its push is
      #      rejected as non-fast-forward, so "Re-run failed jobs" could
      #      never recover an auto-bumped release.
      #   2. Has main moved on with real commits? Then the newer push has
      #      its own run, and that run releases this commit too. Stand
      #      down instead of fighting it for the push.
      #   3. Otherwise: a version whose tag does not exist yet was set by
      #      hand (a major/minor bump) and is used as-is; one tagged on
      #      this very commit is a re-run of exactly that; a version
      #      tagged anywhere else gets its patch bumped.
      #
      # "Hand-edited" is decided by the VALUE (is it tagged yet?), never
      # by whether the commit touched version.go: a comment or copyright
      # edit to that file used to resolve to the already-released version,
      # find its tag, and delete the live release as a "retry".
      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          git fetch --quiet --tags origin main

          for c in $(git rev-list --reverse HEAD..origin/main); do
            subject=$(git log -1 --format=%s "$c")
            [[ "$subject" == *"[skip ci]" ]] || break
            if [[ "$subject" =~ ^Release\ v([0-9]+\.[0-9]+\.[0-9]+)\ \[skip\ ci\]$ ]]; then
              echo "This commit was already bumped to v${BASH_REMATCH[1]} ($c) — resuming that release."
              git checkout --quiet --detach "$c"
              echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
              echo "bumped=false"               >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          # Captured first, then grepped: with pipefail, a grep that exits
          # on its first hit can SIGPIPE `git log` and turn "yes" into "no".
          ahead=$(git log --format=%s HEAD..origin/main)
          if [[ -n "$ahead" ]] && grep -qv '\[skip ci\]$' <<<"$ahead"; then
            echo "main has newer commits — their run releases this one too. Nothing to do."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi

          CURRENT=$(sed -nE 's/.*const Version = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' internal/version/version.go)
          if [[ -z "$CURRENT" ]]; then
            echo "Could not parse version from internal/version/version.go" >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/v$CURRENT" >/dev/null; then
            echo "v$CURRENT is not tagged yet — a hand-set version, using as-is."
            echo "version=$CURRENT"  >> "$GITHUB_OUTPUT"
            echo "bumped=false"      >> "$GITHUB_OUTPUT"
          elif [[ "$(git rev-parse "v$CURRENT^{commit}")" == "$(git rev-parse HEAD)" ]]; then
            # The tag is on this very commit: a re-run of a hand-set
            # version whose publish failed. Finish it, don't bump past it.
            echo "v$CURRENT is already tagged on this commit — resuming that release."
            echo "version=$CURRENT"  >> "$GITHUB_OUTPUT"
            echo "bumped=false"      >> "$GITHUB_OUTPUT"
          else
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "Auto-bumping $CURRENT → $NEW"
            echo "version=$NEW" >> "$GITHUB_OUTPUT"
            echo "bumped=true"  >> "$GITHUB_OUTPUT"
          fi

      # Commit the bumped version.go back to main. The [skip ci] marker
      # in the commit message tells GitHub Actions not to re-run this
      # workflow (which would loop forever).
      #
      # main can have moved since checkout — the previous release's
      # formula commit lands late, and a PR can merge mid-run. Bot commits
      # are rebased over; a real commit means a newer run owns the release
      # (see step above), so this one stands down rather than tagging code
      # its own test gate never saw.
      - name: Commit version bump
        if: env.SKIP_RELEASE != 'true' && steps.version.outputs.bumped == 'true'
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.version }}"

          sed -i -E "s/(const Version = )\"[0-9]+\.[0-9]+\.[0-9]+\"/\1\"$NEW\"/" internal/version/version.go

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/version/version.go
          git commit -m "Release v$NEW [skip ci]"

          for attempt in 1 2 3; do
            git fetch --quiet origin main
            ahead=$(git log --format=%s HEAD~1..origin/main)
            if [[ -n "$ahead" ]] && grep -qv '\[skip ci\]$' <<<"$ahead"; then
              echo "main gained new commits mid-run — their run releases this one too. Nothing to do."
              echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
              exit 0
            fi
            git rebase --quiet origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt was rejected — retrying."
            sleep 3
          done
          echo "Could not push the version bump to main." >&2
          exit 1

      # Always create + push the tag (even when version was hand-edited
      # — that's the whole point of accepting it as-is). An existing tag
      # is only ever a retry when it points at the commit this run is
      # about to release; anything else is a mix-up, and the run stops
      # before the step below can delete a release that is fine.
      - name: Tag release
        id: tag
        if: env.SKIP_RELEASE != 'true'
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null; then
            if [[ "$(git rev-parse "v$NEW^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag v$NEW exists but points at a different commit than this run's — refusing to touch its release." >&2
              exit 1
            fi
            echo "Tag v$NEW already exists on this commit — release will retry against it."
            echo "tag_existed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag_existed=false" >> "$GITHUB_OUTPUT"
          # Configure identity here too: the hand-edited-version path
          # skips the bump step above, and an annotated tag without an
          # ident fails the whole release.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEW" -m "Release v$NEW"
          git push origin "v$NEW"

      # A previous run got as far as the tag but failed before (or
      # during) publish — GoReleaser refuses to recreate a release that
      # already exists. Clear the half-published release object (never
      # the tag, which GoReleaser needs to still be there) so the retry
      # below can recreate it cleanly. The tag step has already proved
      # the tag is on this run's commit, so what is deleted here is
      # rebuilt from the same source a few steps later.
      - name: Clear half-published release on retry
        if: env.SKIP_RELEASE != 'true' && steps.tag.outputs.tag_existed == 'true'
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.version }}"
          gh release delete "v$NEW" --yes || echo "No release object for v$NEW — nothing to clear."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Needed by .goreleaser.yml's signs: block, which shells out to
      # `cosign sign-blob` on checksums.txt. Keyless signing exchanges the
      # job's OIDC token for a short-lived cert — no key material to manage
      # or leak.
      - name: Install cosign
        if: env.SKIP_RELEASE != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Pinned exactly, like the staticcheck version test.yml pins: the
      # tool that builds every shipped binary must not float on "latest"
      # and silently change what we ship on release day.
      - name: Run GoReleaser
        if: env.SKIP_RELEASE != 'true'
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.18.0
          args: release --clean
        env:
          # Same-repo brew formula push uses the default workflow token —
          # no separate tap repo or PAT needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Separate from cosign's checksum signature: this is GitHub's own
      # build-provenance attestation (SLSA-style), attached to the release
      # via the repo's Attestations UI/API rather than shipped as a
      # release asset.
      - name: Attest build provenance
        if: env.SKIP_RELEASE != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

