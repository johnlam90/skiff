#
# GoReleaser config for Skiff. Driven by .github/workflows/release.yml on
# every push to main: that workflow bumps internal/version/version.go and
# tags v<x.y.z>, then invokes `goreleaser release --clean`. Goreleaser then
# cross-compiles the binary, archives it, attaches it to a GitHub Release,
# and (when the homebrew tap secret is set) updates the Homebrew formula.

version: 2

project_name: skiff

before:
  hooks:
    - go mod tidy

builds:
  - id: skiff
    binary: skiff
    main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Skip windows/arm64 — less common, and we'd rather not ship binaries
    # we can't easily test. Add it back if there's demand.
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

# Keyless cosign signature over checksums.txt: signing the checksum file
# covers every archive it lists. Verification is optional in install.sh
# (when cosign is on PATH) so BusyBox/minimal targets keep working.
signs:
  - cmd: cosign
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]
    artifacts: checksum
    certificate: "${artifact}.pem"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

# Homebrew formula committed straight back into this repo under Formula/.
# Users install via:
#
#   brew tap johnlam90/skiff https://github.com/johnlam90/skiff
#   brew install johnlam90/skiff/skiff
#
# Because the formula lives in the same repo as the source, the default
# GITHUB_TOKEN the workflow already holds is enough to push it — no PAT,
# no separate tap repo. The [skip ci] marker on the formula-update commit
# stops the new push from triggering a second release run.
brews:
  - name: skiff
    repository:
      owner: johnlam90
      name: skiff
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    commit_msg_template: "Update {{ .ProjectName }} brew formula to {{ .Tag }} [skip ci]"
    homepage: "https://github.com/johnlam90/skiff"
    description: "Skiff — opinionated mouse-first terminal code editor."
    license: "MIT"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    install: |
      bin.install "skiff"
    # `brew test` must actually execute the binary. Asserting the file
    # exists passes for a zero-byte file, a wrong-arch build, or a binary
    # that dies on start — every failure mode a bottle test is for. Both
    # flag paths print and exit before tcell touches a terminal, so they
    # are safe in Homebrew's non-tty sandbox, and shell_output already
    # fails the test on a non-zero exit.
    test: |
      assert_match "skiff #{version}", shell_output("#{bin}/skiff --version")
      assert_match "action menu", shell_output("#{bin}/skiff --help")
