#
# GoReleaser config for Skiff. Driven by .github/workflows/release.yml on
# every push to main: that workflow bumps internal/version/version.go and
# tags v<x.y.z>, then invokes `goreleaser release --clean`. Goreleaser then
# cross-compiles the binary, archives it, attaches it to a GitHub Release,
# and (when the homebrew tap secret is set) updates the Homebrew formula.

version: 2

project_name: skiff

before:
  hooks:
    - go mod tidy

builds:
  - id: skiff
    binary: skiff
    main: .
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Skip windows/arm64 — less common, and we'd rather not ship binaries
    # we can't easily test. Add it back if there's demand.
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

# Keyless cosign signature over checksums.txt: signing the checksum file
# covers every archive it lists. Verification is optional in install.sh
# (when cosign is on PATH) so BusyBox/minimal targets keep working.
signs:
  - cmd: cosign
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]
    artifacts: checksum
    certificate: "${artifact}.pem"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"

# Homebrew formula committed straight back into this repo under Formula/.
# Users install via:
#
#   brew tap johnlam90/skiff https://github.com/johnlam90/skiff
#   brew install johnlam90/skiff/skiff
#
# Because the formula lives in the same repo as the source, the default
# GITHUB_TOKEN the workflow already holds is enough to push it — no PAT,
# no separate tap repo. The [skip ci] marker on the formula-update commit
# stops the new push from triggering a second release run.
#
# NOTE(deprecation): goreleaser v2 deprecates top-level `brews:` in favor
# of Cask-based publishing (`homebrew_casks`). As of the GoReleaser
# version release.yml now pins (v2.18.0), this is no longer a soft
# warning: `goreleaser check` HARD-FAILS with "configuration is valid,
# but uses deprecated properties" whenever brews: is present (confirmed
# 2026-08-29 — a real `release --snapshot --clean --skip=publish` build
# still succeeds past the warning, so this only blocks the strict check
# gate, not an actual release, for now). Treat that as reason to migrate
# SOON: `goreleaser check` has been red on this key since this pass
# pinned the tool, and a future GoReleaser bump could turn the warning
# into a real release-time removal, not just a check-time one. Migration
# changes the install mechanism for existing formula users
# (quarantine/caveats differ) and the tap pull-sync consumes
# Formula/skiff.rb — migrate ONLY on a prerelease tag first, and verify
# `brew upgrade` from an existing formula install before letting a real
# release use it.
#
# For whoever does this: release.yml's cosign-installer and
# attest-build-provenance steps (added alongside signs: in the same
# hardening pass as this pin) were resolved to these SHAs on 2026-08-29 —
# reuse them or re-resolve fresh ones if you're bumping while in here:
#   sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
#   actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
brews:
  - name: skiff
    repository:
      owner: johnlam90
      name: skiff
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    commit_msg_template: "Update {{ .ProjectName }} brew formula to {{ .Tag }} [skip ci]"
    homepage: "https://github.com/johnlam90/skiff"
    description: "Skiff — opinionated mouse-first terminal code editor."
    license: "MIT"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    install: |
      bin.install "skiff"
    # `brew test` must actually execute the binary. Asserting the file
    # exists passes for a zero-byte file, a wrong-arch build, or a binary
    # that dies on start — every failure mode a bottle test is for. Both
    # flag paths print and exit before tcell touches a terminal, so they
    # are safe in Homebrew's non-tty sandbox, and shell_output already
    # fails the test on a non-zero exit.
    test: |
      assert_match "skiff #{version}", shell_output("#{bin}/skiff --version")
      assert_match "action menu", shell_output("#{bin}/skiff --help")
